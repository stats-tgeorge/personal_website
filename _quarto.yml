project:
  type: website
  # Explore mode: copy the game's files (JavaScript, CSS) and its list
  # of places into the rendered site as they are. Quarto does not find
  # them on its own.
  resources:
    - "explore/**"
    - "explore-world.yml"

execute:
  freeze: true
    
website:
  title: "Tyler George"
  search: 
    location: navbar
    type: overlay
    
  navbar:
    background: "#523178"
    # "Explore Mode" sits on the left, beside the site's title, so it
    # stands apart from the ordinary pages on the right.
    left:
      - text: "Explore Mode"
        icon: controller
        file: explore.qmd
      
      # - student_work_showcase.qmd
      # - teaching_ped.qmd
      
    right:
      
      # - talks.qmd

      - text: "About"
        file: about.qmd
        
              
      - text: "Student Support"
        file: course-support.qmd
      - teaching.qmd
      
      - text: "Blog"
        file: Blog.qmd

      - text: CV
        file: cv.qmd
      - text: "Useful Links"
        file: useful-links.qmd
        
      - icon: github 
        href: https://github.com/stats-tgeorge/personal_website
        aria-label: GitHub
      - icon: twitter-x
        href: https://x.com/stats_tgeorge
        aria-label: X (formerly Twitter)
      # The Bluesky butterfly is drawn by styles.css.
      - icon: bluesky
        href: https://bsky.app/profile/stats-tgeorge.bsky.social
        aria-label: Bluesky

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    linkcolor: "#523178"
editor: visual

